name: threads-post
on:
  workflow_dispatch:
    inputs:
      slot: {description: 'post index 0-2', required: false, default: ''}
  schedule:
    - cron: '43 23 * * *'
    - cron: '43 4 * * *'
    - cron: '43 11 * * *'
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull -q || true
      - run: python ops/threads_post.py ${{ github.event.inputs.slot }}
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      - run: |
          git config user.name "kbn-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/threads_log.json
          git diff --cached --quiet || { git commit -m "Threads posted $(date -u +%FT%H:%M)"; git pull -q --rebase; git push; }
