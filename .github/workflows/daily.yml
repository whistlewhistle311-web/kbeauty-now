name: daily-rankings
on:
  schedule:
    - cron: '17 21 * * *'   # 06:17 KST, after Hwahae's 05:00 ranking update
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node fetch.mjs
      - run: python build.py docs
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node pins.mjs
      - name: commit
        run: |
          git config user.name "kbeauty-now-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs untranslated.txt pins.json
          git diff --cached --quiet || git commit -m "Daily ranking update $(date -u +%F)"
          git push
      - name: notify IndexNow
        run: |
          KEY=$(cat indexnow.key)
          URLS=$(python -c "import re;print(','.join('\"'+u+'\"' for u in re.findall(r'<loc>([^<]+)</loc>',open('docs/sitemap.xml').read())))")
          curl -s -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json" -d "{\"host\":\"whistlewhistle311-web.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"https://whistlewhistle311-web.github.io/kbeauty-now/$KEY.txt\",\"urlList\":[$URLS]}" || true
      - name: post pins to Pinterest
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        run: |
          if [ -z "$PINTEREST_TOKEN" ]; then echo "no token"; exit 0; fi
          F=$(python -c "import json;print(json.load(open('pins.json'))['pins'][0]['file'])")
          for i in $(seq 1 30); do curl -sfI "https://whistlewhistle311-web.github.io/kbeauty-now/pins/$F" >/dev/null && break; sleep 10; done
          python pin_post.py
          git add data/posted.json
          git diff --cached --quiet || { git commit -m "Pinterest posted $(date -u +%F)"; git push; }
