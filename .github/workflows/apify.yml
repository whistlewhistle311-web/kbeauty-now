name: apify-sync
on:
  workflow_dispatch:
  push:
    paths: ['ops/**']
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python ops/apify_sync.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - run: python ops/gumroad_sync.py
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
      - run: python ops/awin_sync.py
        env:
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
      - run: |
          git config user.name "kbn-bot"; git config user.email "bot@users.noreply.github.com"
          git pull -q --rebase || true
          git add data/apify_stats.json data/gumroad_stats.json data/awin_stats.json
          git diff --cached --quiet || { git commit -m "Apify stats $(date -u +%FT%H:%M)"; for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep $((i*5)); done; }
